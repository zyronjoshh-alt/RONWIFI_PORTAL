<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="3; url=$(link-status)">
<title>RONwifi - Logging in</title>
<link rel="stylesheet" href="ronwifi.css">

$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
</form>

<script src="md5.min.js"></script>
<script>
function doLogin(username, password) {
    document.sendin.username.value = username;
    document.sendin.password.value = hexMD5('$(chap-id)' + password + '$(chap-challenge)');
    document.sendin.submit();
    return false;
}

// Get credentials from URL parameters
var urlParams = new URLSearchParams(window.location.search);
var username = urlParams.get('username');
var password = urlParams.get('password');

if (username && password) {
    doLogin(username, password);
} else {
    // No credentials provided, redirect to portal
    setTimeout(function() {
        window.location.href = '/ronwifi.html';
    }, 2000);
}
</script>
$(endif)

</head>
<body style="background: #1a1a2e; color: #eee; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<div style="text-align: center;">
    <div class="spinner" style="width: 48px; height: 48px; border: 4px solid #333; border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px;"></div>
    <p style="font-size: 16px; margin: 0; opacity: 0.9;">Logging you in...</p>
    <p style="font-size: 13px; margin-top: 8px; opacity: 0.5;">Please wait</p>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
